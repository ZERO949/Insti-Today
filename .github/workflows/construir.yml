# Construye el instalador de Windows de Insti Today y lo deja como artefacto de la
# ejecución. No publica nada ni firma la actualización (la llave no está en GitHub).
# GitHub → Actions → Construir → Run workflow.
name: Construir

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Pruebas
        run: npm run probar
      - run: npx tauri build --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"
      - uses: actions/upload-artifact@v4
        with:
          name: insti-today-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
